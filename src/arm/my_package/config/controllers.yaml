controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - bracket_joint
      - humerus_low_joint
      - forearm_low_joint
      - ubracket_joint
      - endeffector_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

gazebo_ros2_control:
  ros__parameters:
    pid_gains:
      bracket_joint: {p: 1000.0, i: 0.0, d: 10.0}
      humerus_low_joint: {p: 5000.0, i: 0.0, d: 50.0}
      forearm_low_joint: {p: 5000.0, i: 0.0, d: 50.0}
      ubracket_joint: {p: 1000.0, i: 0.0, d: 10.0}
      endeffector_joint: {p: 1000.0, i: 0.0, d: 10.0}