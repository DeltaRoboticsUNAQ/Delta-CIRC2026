# Default joystick mapping (edit for your controller).
# This generates geometry_msgs/Twist for a skid-steer rover.
#
# Common Xbox mapping (may vary by driver/OS):
# - Left stick vertical: axis 1 (forward/back)
# - Right stick horizontal: axis 3 (turn)
# - RB: enable
# - A: turbo

teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 5
    enable_turbo_button: 0

    axis_linear:
      x: 1
    scale_linear:
      x: 1.0
    scale_linear_turbo:
      x: 1.6

    axis_angular:
      yaw: 3
    scale_angular:
      yaw: 1.2
    scale_angular_turbo:
      yaw: 1.6
